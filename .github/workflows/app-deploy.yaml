name: Deploy App

on:
  repository_dispatch:
    types: [infra-ready]

jobs:
  deploy:
    name: Deploy to provisioned server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.event.client_payload.server_ip }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.STAGING_FRONTEND_DEPLOY_PATH }}"

            if [ -z "$DEPLOY_PATH" ]; then
              echo "ERROR: STAGING_FRONTEND_DEPLOY_PATH secret is empty. Aborting."
              exit 1
            fi

            echo "Deploying to: $DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ -d "$DEPLOY_PATH/.git" ]; then
              echo "Repo already cloned, pulling latest..."
              git pull origin develop
            else
              echo "No repo found. Clearing directory and cloning fresh..."
              find "$DEPLOY_PATH" -mindepth 1 -delete
              git clone https://github.com/404-Fixers/Pulse_Point_FE.git .
            fi

            npm install
            npm run build
            pm2 restart pulsepoint-frontend-staging || pm2 start npm --name "pulsepoint-frontend-staging" -- start